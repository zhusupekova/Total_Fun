name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build Next.js (static)
        run: npm run build
      - name: Run WS server smoke
        run: |
          cd server
          npm ci
          node server.js &
          sleep 3
          cd ..
          npm run smoke:ws -- --url=ws://localhost:7071
      - name: Run Playwright tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
