name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Run WS server smoke
        run: |
          cd server
          npm ci
          node server.js &
          sleep 3
          cd ..
          npm run smoke:ws -- --url=ws://localhost:7071
      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:3000/game
        run: |
          npm run dev -- --hostname 0.0.0.0 --port 3000 &
          npx playwright install --with-deps chromium
          sleep 10
          npm run test:e2e
